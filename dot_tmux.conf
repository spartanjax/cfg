# ~/.tmux.conf — managed by jf-config (chezmoi). Shared by Linux/WSL and macOS.

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 100000
set -g escape-time 10
set -g renumber-windows on

# True color.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- Prefix --------------------------------------------------------------
# Ctrl+Space instead of the default Ctrl+b.
set -g prefix C-Space
unbind C-b
# Press the prefix twice to send a literal Ctrl+Space to the running program.
bind C-Space send-prefix

# --- Plugins (TPM) -------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# --- Theme: Tokyo Night --------------------------------------------------
# Requires a Nerd Font v3+ in the terminal (see README). The theme sets its
# own status-bar lengths (80/150) and owns status-left/right.
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @tokyo-night-tmux_theme 'night'         # night | storm | moon | day
set -g @tokyo-night-tmux_transparent 1         # sit on the translucent WT background
set -g @tokyo-night-tmux_show_git 1            # branch + ahead/behind
set -g @tokyo-night-tmux_show_path 1           # current pane path
set -g @tokyo-night-tmux_show_netspeed 1       # network up/down speed
set -g @tokyo-night-tmux_show_battery_widget 1 # battery level

# --- Developer companions ------------------------------------------------
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save + auto-restore
set -g @plugin 'tmux-plugins/tmux-yank'        # system clipboard integration
set -g @plugin 'sainnhe/tmux-fzf'              # fzf-powered menus (needs fzf)

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom).
run '~/.tmux/plugins/tpm/tpm'
